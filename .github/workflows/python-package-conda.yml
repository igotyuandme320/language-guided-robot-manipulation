name: Python planning checks

on: [push]

jobs:
  planning-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'
    - name: Check Python syntax
      run: |
        python -m compileall -q planning execution scenes scripts skills tests
    - name: Test the pure-Python language and planning modules
      run: |
        python -m unittest discover -s tests -p 'test_language.py' -v
        python -m unittest discover -s tests -p 'test_symbolic.py' -v
        python -m unittest discover -s tests -p 'test_grounding.py' -v
        python -m unittest discover -s tests -p 'test_evaluation.py' -v
        python -m unittest discover -s tests -p 'test_llm.py' -v
        python -m unittest discover -s tests -p 'test_language_evaluation.py' -v
        python -m unittest discover -s tests -p 'test_guarded_language.py' -v
        python -m unittest discover -s tests -p 'test_recording.py' -v
        python -m unittest discover -s tests -p 'test_monitoring.py' -v
    # GPU simulation, torch skills, and the Isaac Lab CLI are checked locally.
